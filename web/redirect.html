<!DOCTYPE html>
<html>

<head>
  <title>Redirecting...</title>
</head>

<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      window.opener.postMessage({ code: code }, '*');
    }
    window.close();
  </script>
</body>

</html>
